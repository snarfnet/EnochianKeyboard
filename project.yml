name: EnochianKeyboard
options:
  bundleIdPrefix: com.tokyonasu
  deploymentTarget:
    iOS: "17.0"

settings:
  base:
    SWIFT_VERSION: "5.0"
    TARGETED_DEVICE_FAMILY: "1,2"
    MARKETING_VERSION: "1.0"
    CURRENT_PROJECT_VERSION: "1"
    DEVELOPMENT_TEAM: 83VGKGSQUH
    CODE_SIGN_STYLE: Automatic

targets:
  EnochianKeyboard:
    type: application
    platform: iOS
    sources: [App, Shared, Resources]
    dependencies:
      - target: KeyboardExtension
        embed: true
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.tokyonasu.EnochianKeyboard
        INFOPLIST_FILE: App/Info.plist
        PRODUCT_NAME: EnochianKeyboard
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        ASSETCATALOG_COMPILER_GLOBAL_ACCENT_COLOR_NAME: AccentColor
    info:
      path: App/Info.plist
      properties:
        CFBundleName: EnochianKeyboard
        CFBundleDisplayName: エノク文字キーボード
        CFBundleDevelopmentRegion: ja
        CFBundleLocalizations: [ja, en]
        CFBundleShortVersionString: "1.0"
        CFBundleVersion: "$(CURRENT_PROJECT_VERSION)"
        LSRequiresIPhoneOS: true
        ITSAppUsesNonExemptEncryption: false
        NSPhotoLibraryAddUsageDescription: 作った画像を写真に保存します。
        UILaunchScreen:
          UIColorName: ""
        UISupportedInterfaceOrientations:
          - UIInterfaceOrientationPortrait
        UISupportedInterfaceOrientations~ipad:
          - UIInterfaceOrientationPortrait
          - UIInterfaceOrientationPortraitUpsideDown
          - UIInterfaceOrientationLandscapeLeft
          - UIInterfaceOrientationLandscapeRight

  KeyboardExtension:
    type: app-extension
    platform: iOS
    sources: [Keyboard, Shared, Resources]
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.tokyonasu.EnochianKeyboard.Keys
        INFOPLIST_FILE: Keyboard/Info.plist
        PRODUCT_NAME: KeyboardExtension
    info:
      path: Keyboard/Info.plist
      properties:
        CFBundleDisplayName: エノク文字キーボード
        CFBundleDevelopmentRegion: ja
        CFBundleLocalizations: [ja, en]
        CFBundleShortVersionString: "1.0"
        CFBundleVersion: "$(CURRENT_PROJECT_VERSION)"
        NSExtension:
          NSExtensionPointIdentifier: com.apple.keyboard-service
          NSExtensionPrincipalClass: $(PRODUCT_MODULE_NAME).KeyboardViewController
          NSExtensionAttributes:
            IsASCIICapable: false
            PrefersRightToLeft: false
            PrimaryLanguage: en-US
            RequestsOpenAccess: true
